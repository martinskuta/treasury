services:
  compose-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
    ports:
      - "18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "treasury-pgdata"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__treasurydb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=treasurydb"
      TREASURYDB_HOST: "postgres"
      TREASURYDB_PORT: "5432"
      TREASURYDB_USERNAME: "postgres"
      TREASURYDB_PASSWORD: "${POSTGRES_PASSWORD}"
      TREASURYDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/treasurydb"
      TREASURYDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/treasurydb"
      TREASURYDB_DATABASENAME: "treasurydb"
      Admin__UserName: "${ADMIN_USERNAME}"
      Admin__Password: "${ADMIN_PASSWORD}"
      Storage__DataRoot: "/data"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "${TREASURY_HTTP_PORT:-8080}:${API_PORT}"
    volumes:
      - type: "bind"
        target: "/data"
        source: "${TREASURY_DATA_DIR:-./data}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  treasury-pgdata:
    driver: "local"
