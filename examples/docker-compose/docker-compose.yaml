services:
  compose-dashboard:
    image: "mcr.microsoft.com/aspire/nightly/dashboard:17.0"
    environment:
      ASPIRE_DASHBOARD_TELEMETRY_OPTOUT: "true"
      # --- Telemetry storage ---------------------------------------------------------------------------------
      # The dashboard keeps the API's logs, traces and metrics in a SQLite database. ASPIRE_DASHBOARD_PERSISTENCE_MODE
      # decides what happens to it when the dashboard container restarts. To uncomment a line below, remove
      # its "# " and keep the indentation.
      #
      # None (default; nothing to set): a temporary database inside the container. Telemetry is lost whenever the
      #   dashboard container is restarted or recreated.
      #
      # Resume: one database that is reused across restarts; new telemetry is appended and the oldest is dropped
      #   once the limits are reached (100,000 log entries, 100,000 traces, 50,000 points per metric dimension).
      #   Uncomment the three variables below, the "volumes" block of this service, and "treasury-dashboard-data"
      #   under the top-level "volumes" at the end of the file.
      #
      # Run: a new database on every dashboard start; earlier starts stay available read-only under "Recordings"
      #   in the dashboard (the 10 most recent, plus the ones you pin). Same as Resume, with the mode set to "Run".
      #
      # Keep the mode and the application name unchanged once chosen. The stored telemetry is not encrypted and
      # can contain sensitive data. The database file never shrinks; to start over, stop the stack and delete the
      # volume `<project>_treasury-dashboard-data`.
      #
      # ASPIRE_DASHBOARD_PERSISTENCE_MODE: "Resume"
      # ASPIRE_DASHBOARD_APPLICATION_NAME: "treasury"
      # ASPIRE_DASHBOARD_DATA_DIRECTORY: "/home/app/dashboard-data"
    # Resume / Run: the volume that holds the database. It must be mounted at /home/app, the home of the
    # dashboard's non-root user; mounted anywhere else it belongs to root and the dashboard cannot write to it.
    # volumes:
    #   - type: "volume"
    #     target: "/home/app"
    #     source: "treasury-dashboard-data"
    #     read_only: false
    ports:
      - "18888:18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "treasury-pgdata"
        read_only: false
    networks:
      - "aspire"
    restart: "unless-stopped"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__treasurydb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=treasurydb"
      TREASURYDB_HOST: "postgres"
      TREASURYDB_PORT: "5432"
      TREASURYDB_USERNAME: "postgres"
      TREASURYDB_PASSWORD: "${POSTGRES_PASSWORD}"
      TREASURYDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/treasurydb"
      TREASURYDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/treasurydb"
      TREASURYDB_DATABASENAME: "treasurydb"
      Admin__UserName: "${ADMIN_USERNAME}"
      Admin__Password: "${ADMIN_PASSWORD}"
      Storage__DataRoot: "/data"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    ports:
      - "${TREASURY_HTTP_PORT:-8080}:${API_PORT}"
    volumes:
      - type: "bind"
        target: "/data"
        source: "${TREASURY_DATA_DIR:-./data}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
    restart: "unless-stopped"
networks:
  aspire:
    driver: "bridge"
volumes:
  treasury-pgdata:
    driver: "local"
  # Resume / Run telemetry storage of the dashboard (see compose-dashboard above).
  # treasury-dashboard-data:
  #   driver: "local"
